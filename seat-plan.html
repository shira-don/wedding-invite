<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Your Seat — Shira &amp; Leendon</title>
  <meta name="description" content="Find your table for the reception of Shira & Leendon, December 6, 2026." />
  <meta name="theme-color" content="#7b5ea7" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%9C%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="fonts/google-fonts.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Montserrat', sans-serif; font-weight: 300; color: #3a3a3a;
      line-height: 1.7; min-height: 100vh;
      background:
        radial-gradient(120% 55% at 50% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%),
        linear-gradient(180deg, rgba(250,247,255,.94), rgba(238,231,246,.88));
    }
    .container { max-width: 980px; margin: 0 auto; padding: 0 1.5rem; }
    section { padding: .4rem 0 1.5rem; }

    .sec-hero { position: relative; max-width: 560px; margin: 0 auto .6rem; text-align: center; }
    .sec-accent { position: absolute; top: -.35rem; width: 70px; height: auto; opacity: .8; pointer-events: none; z-index: 0; }
    .sec-accent.left  { left: 0; transform: scaleX(-1) rotate(-20deg); }
    .sec-accent.right { right: 0; transform: rotate(-20deg); }
    .sec-pre, .sec-heading { position: relative; z-index: 1; }
    .sec-pre { font-size: .68rem; letter-spacing: 4px; text-transform: uppercase; color: #7b5ea7; }
    .sec-heading {
      font-family: 'Cormorant Garamond', serif; font-weight: 500;
      font-size: 2rem; letter-spacing: 5px; color: #a89bbb; margin: .1rem 0 0;
    }

    .card { background: rgba(216,200,236,.28); border-radius: 14px; padding: .65rem; max-width: 520px; margin: 0 auto; }
    .field label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .field input {
      width: 100%; padding: .7rem .85rem; border: 1px solid #e0d6ee; border-radius: 8px;
      font-family: 'Montserrat', sans-serif; font-size: 1rem; background: #fff; color: #3a3a3a;
    }
    .field input:focus { outline: none; border-color: #7b5ea7; }
    .btn {
      display: inline-block; margin-top: 1.25rem; padding: .9rem 2.4rem; border: none; cursor: pointer;
      background: #7b5ea7; color: #fff; border-radius: 4px;
      font-family: 'Montserrat', sans-serif; font-size: .72rem; letter-spacing: 3px; text-transform: uppercase;
      transition: background .25s;
    }
    .btn:hover { background: #6a4a97; }
    .search-row { display: flex; gap: .5rem; align-items: stretch; }
    .search-row input { flex: 1; width: auto; min-width: 0; }
    .search-row .btn { margin-top: 0; white-space: nowrap; padding: 0 1.6rem; }
    .btn-sm { display: none; }
    .msg:empty { display: none; }

    .hit { display: flex; justify-content: space-between; align-items: baseline; gap: .8rem; width: 100%;
      margin-top: .4rem; padding: .55rem .8rem; background: #fff; border: 1px solid rgba(168,155,187,.4);
      border-radius: 10px; cursor: pointer; text-align: left; font: inherit; }
    .hit:hover { border-color: #7b5ea7; }
    .hit-name { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.02rem; color: #3a3a3a; }
    .hit-table { font-size: .72rem; letter-spacing: 1.5px; text-transform: uppercase; color: #7b5ea7; white-space: nowrap; }

    /* table guest list, shown over the map rather than below it */
    .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      padding: 1rem; background: rgba(40,28,56,.45); }
    .modal[hidden] { display: none; }
    .modal-card { position: relative; width: 100%; max-width: 420px; max-height: 80vh; overflow-y: auto;
      background: #fff; border-radius: 14px; padding: .9rem 1.1rem 1rem; box-shadow: 0 18px 40px -12px rgba(40,28,56,.45); }
    .m-close { position: absolute; top: .35rem; right: .45rem; width: 2.2rem; height: 2.2rem; border: none; background: none;
      font-size: 1.6rem; line-height: 1; color: #8a8398; cursor: pointer; border-radius: 50%; }
    .m-close:hover, .m-close:focus-visible { background: #f3eef9; color: #5d3f87; outline: none; }
    .m-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: .2rem .7rem; padding: 0 2.2rem .5rem 0;
      border-bottom: 1px solid rgba(168,155,187,.3); margin-bottom: .45rem; }
    .m-title { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.5rem; color: #7b5ea7; letter-spacing: .5px; }
    .m-note { font-size: .62rem; letter-spacing: 1.5px; text-transform: uppercase; color: #52734d; }
    .m-match { padding: 0 2.2rem .5rem 0; border-bottom: 1px solid rgba(168,155,187,.3); margin-bottom: .5rem; }
    .m-name { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.35rem; color: #3a3a3a; line-height: 1.2; }
    .m-where { display: flex; align-items: baseline; flex-wrap: wrap; gap: .1rem .6rem; margin-top: .1rem; }
    .m-tbl { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.6rem; color: #7b5ea7; letter-spacing: .5px; }
    .m-label { font-size: .62rem; letter-spacing: 1.5px; text-transform: uppercase; color: #7b5ea7; margin-bottom: .2rem; }
    .m-warn { font-size: .75rem; color: #8a5a1c; background: #fff6ec; border-radius: 6px; padding: .35rem .6rem; margin-bottom: .45rem; }
    .modal-card .m-list { margin-top: 0; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 0 .9rem; }
    .modal-card .m-list li { line-height: 1.55; font-size: .92rem; }
    .msg { text-align: center; margin-top: 1.25rem; font-size: .9rem; color: #c0392b; }

    .toggle { display: block; margin: 1.25rem auto 0; background: none; border: none; cursor: pointer;
      font-family: 'Montserrat', sans-serif; font-size: .72rem; letter-spacing: 3px; text-transform: uppercase;
      color: #7b5ea7; border-bottom: 1px solid rgba(123,94,167,.4); padding-bottom: .25rem; }

    /* ── floor plan ── */
    .plan { margin-top: .9rem; }
    .plan-title { text-align: center; font-family: 'Cormorant Garamond', serif; font-weight: 500;
      font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; color: #4c6b4c; }
    .plan-hint { text-align: center; font-size: .7rem; letter-spacing: 1px; color: #8a8398; margin: .1rem 0 .5rem; }
    .plan-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch;
      background: #fff; border: 1px solid rgba(168,155,187,.4); border-radius: 14px; padding: .5rem; }
    #map { display: block; width: 100%; min-width: 620px; height: auto; }
    .room   { fill: #fdfcff; stroke: #5b2740; stroke-width: 3; }
    .box    { fill: #fff; stroke: #b9a089; stroke-width: 1.5; }
    .box-t  { font-family: 'Montserrat', sans-serif; font-size: 11px; fill: #4a4652; text-anchor: middle; }
    .mini   { font-family: 'Montserrat', sans-serif; font-size: 9px; letter-spacing: 1px; fill: #8a8398; text-anchor: middle; }
    .cake   { fill: #efe7f7; stroke: #b7a5cd; stroke-width: 1.5; }
    .buffet-tbl { fill: #f6efe7; stroke: #c6ad93; stroke-width: 1.2; }
    .cloche path { fill: #fff; stroke: #a98f74; stroke-width: 1.2; }
    .cloche line { stroke: #a98f74; stroke-width: 1.4; stroke-linecap: round; }
    .cloche circle { fill: #a98f74; }
    .stair-band { fill: #f3eef9; }
    .mini.ct { fill: #5d3f87; font-size: 7.5px; }
    .couple { fill: #efe7f7; stroke: #7b5ea7; stroke-width: 1.5; }
    .stair  { fill: none; stroke: #3a3a3a; stroke-width: 2.5; }
    .seat   { fill: #fff; stroke: #b9a089; stroke-width: 1; }
    .disc   { fill: #c6ad93; }
    .vip-top{ fill: #c6ad93; stroke: #a98f74; stroke-width: 1; }
    .vip-label { font-family: 'Montserrat', sans-serif; font-size: 12px; fill: #4a4652; text-anchor: middle; }
    .num    { font-family: 'Montserrat', sans-serif; font-size: 13px; fill: #fff; text-anchor: middle; font-weight: 500; }
    .tbl    { cursor: pointer; }
    .tbl:hover .disc, .tbl:focus .disc, .tbl:hover .vip-top, .tbl:focus .vip-top { fill: #a98f74; }
    .tbl.extra .disc { fill: #cfc3d8; stroke: #7b5ea7; stroke-width: 1.5; stroke-dasharray: 3 2; }
    .tbl.on .disc, .tbl.on .vip-top { fill: #7b5ea7; stroke: #5d3f87; }
    .tbl.on .seat { stroke: #7b5ea7; }
    .tbl:focus { outline: none; }
    .legend { display: flex; flex-wrap: wrap; gap: .75rem 1.5rem; justify-content: center;
      margin-top: .6rem; font-size: .68rem; letter-spacing: 1px; color: #6f6880; }
    .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: .4rem; vertical-align: -1px; }
    .loading { text-align: center; font-size: .85rem; color: #8a8398; margin-top: 1rem; }
    .notice { background: #fff6ec; border: 1px solid #e3c9a6; border-radius: 8px;
      padding: .7rem .9rem; margin-top: .75rem; font-size: .8rem; line-height: 1.6; color: #6b4d23; }
    .tbl.empty { opacity: .3; pointer-events: none; }
    .tbl.over .disc, .tbl.over .vip-top { fill: #d9a05b; stroke: #b9792f; }
    .chart { margin-top: 2rem; display: grid; gap: 1rem; }
    .chart[hidden] { display: none; }
    .t-card { background: rgba(255,255,255,.75); border: 1px solid rgba(168,155,187,.35); border-radius: 12px; padding: 1.1rem 1.25rem; }
    .t-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: .5rem; }
    .t-id { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 1.2rem; color: #7b5ea7; letter-spacing: 1px; }
    .t-note { font-size: .62rem; letter-spacing: 1.5px; text-transform: uppercase; color: #52734d; }
    .t-guests { font-family: 'Cormorant Garamond', serif; font-size: 1rem; color: #3a3a3a; line-height: 1.9; }
    .g-list {
      list-style: none; padding: 0; margin: .4rem 0 0; text-align: left;
      display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: .2rem .9rem;
    }
    .g-list li {
      position: relative; padding-left: .95rem;
      font-family: 'Cormorant Garamond', serif; font-size: 1rem; line-height: 1.75; color: #3a3a3a;
    }
    .g-list li::before { content: '\2022'; position: absolute; left: 0; color: #b7a5cd; }
    .g-list li strong { color: #7b5ea7; }

    .topbar { padding-top: .7rem; }
    .topbar a { font-size: .66rem; letter-spacing: 2px; text-transform: uppercase; color: #7b5ea7; text-decoration: none; }
    .topbar a:hover { text-decoration: underline; }

    /* phones */
    @media (max-width: 600px) {
      .container { padding: 0 1rem; }
      .sec-pre { font-size: .62rem; letter-spacing: 3px; }
      .sec-heading { font-size: 1.6rem; letter-spacing: 3px; }
      .sec-accent { width: 54px; }
      .search-row .btn { padding: 0 1.1rem; }
      .btn-lg { display: none; } .btn-sm { display: inline; }
      .plan-title { font-size: 1.05rem; }
      .plan-hint { font-size: .68rem; }
    }

    /* desktop: width the map from the window height so search + map + legend
       fit on one screen (1000x640 viewBox, so width = height x 1.5625) */
    @media (min-width: 601px) {
      .plan-scroll { width: fit-content; max-width: 100%; margin: 0 auto; }
      #map { min-width: 0; width: min(914px, calc(100vw - 90px), calc((100vh - 325px) * 1.5625)); }
    }
  </style>
</head>

      <div class="topbar"><a href="index.html">&larr; Invitation</a></div>
      <div class="sec-hero">
        <img class="sec-accent left" src="images/compressed/lilac-bouquet.webp" alt="" aria-hidden="true" />
        <img class="sec-accent right" src="images/compressed/lilac-bouquet.webp" alt="" aria-hidden="true" />
        <p class="sec-pre">Find Your Seat</p>

.4" width="7.5" height="7.5" rx="1.5" transform="rotate(72.0 828.4 582.1)"/><rect class="seat" x="824.7" y="598.1" width="7.5" height="7.5" rx="1.5" transform="rotate(108.0 828.4 601.9)"/><rect class="seat" x="813.1" y="614.1" width="7.5" height="7.5" rx="1.5" transform="rotate(144.0 816.8 617.9)"/><rect class="seat" x="794.2" y="620.2" width="7.5" height="7.5" rx="1.5" transform="rotate(180.0 798.0 624.0)"/><rect class="seat" x="775.4" y="614.1" width="7.5" height="7.5" rx="1.5" transform="rotate(216.0 779.2 617.9)"/><rect class="seat" x="763.8" y="598.1" width="7.5" height="7.5" rx="1.5" transform="rotate(252.0 767.6 601.9)"/><rect class="seat" x="763.8" y="578.4" width="7.5" height="7.5" rx="1.5" transform="rotate(288.0 767.6 582.1)"/><rect class="seat" x="775.4" y="562.4" width="7.5" height="7.5" rx="1.5" transform="rotate(324.0 779.2 566.1)"/><circle class="disc" cx="798" cy="592" r="21"/><text class="num" x="798" y="597">14</text></g></svg></div>

        </div>
        <p class="loading" id="loading">Loading the seating chart…</p>

    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <button type="button" class="m-close" id="m-close" aria-label="Close">&times;</button>
      <div id="m-body"></div>
    </div>
  </div>

<script>
// home.exe's Apps Script deployment — the project that owns the sheet.
// Paste that project's /exec URL here (no query string).
const SEATS_URL = 'https://script.google.com/macros/s/AKfycbw6GYm5tCHnaHgVBDPLB74okn0CmsQiG5uSzuRdKvXSnssh-mkVWVaDVq0zha9XZDQ1IQ/exec';
const CAP = { 'VIP 1': 16, 'VIP 2': 16 };   // round tables default to 10
const NOTE = { 'VIP 1': "Groom's Family", 'VIP 2': "Bride's Family & Principal Sponsors" };

let TABLES = [];
let UNASSIGNED = [];

// The sheet's TABLE NO. is free text — accept "3", "Table 3", "VIP 1", "vip2".
function tableLabel(raw) {
  const v = String(raw || '').trim();
  if (!v) return '';
  let m = v.match(/^vip\s*([12])$/i);     if (m) return 'VIP ' + m[1];
  m = v.match(/^(?:table\s*)?(\d+)$/i);   if (m) return 'Table ' + Number(m[1]);
  return v;
}
const capOf = id => CAP[id] || 10;

function buildTables(guests) {
  const by = new Map();
  UNASSIGNED = [];
  guests.forEach(g => {
    const id = tableLabel(g.table);
    if (!id) { UNASSIGNED.push(g.name); return; }
    if (!by.has(id)) by.set(id, []);
    by.get(id).push(g.name);
  });
  const rank = id => id.startsWith('VIP') ? [0, id] : [1, parseInt(id.replace(/\D/g, ''), 10) || 999];
  return [...by.entries()]
    .sort((a, b) => { const x = rank(a[0]), y = rank(b[0]); return x[0] - y[0] || (x[1] > y[1] ? 1 : -1); })
    .map(([id, guests]) => ({ id, note: NOTE[id] || '', guests }));
}

const tokens = s => (s || '')
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase().replace(/[.,]/g, ' ')
  .replace(/\b(mr|mrs|ms|miss|sir|madam|dr|doctor|engr|atty|rev|fr|hon|prof|sr|jr|iii|iv|ii)\b/g, ' ')
  .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function find(q) {
  const t = tokens(q);
  if (!t.length) return [];
  const hits = [];
  TABLES.forEach(tb => tb.guests.forEach(g => {
    const gt = tokens(g);
    if (t.every(x => gt.includes(x))) hits.push({ guest: g, table: tb });
  }));
  return hits;
}

function search() {
  const q = document.getElementById('q').value.trim();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  if (!q) { msg.textContent = 'Please enter your name.'; return; }
  const hits = find(q);
  if (!hits.length) {
    msg.textContent = 'We couldn\u2019t find that name. Please check the spelling, or ask our coordinator at 0965 207 6143.';
    return;
  }
  if (hits.length === 1) openMatch(hits[0]);
  else openMatches(hits);
}

document.getElementById('go').addEventListener('click', search);
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); search(); }
});


function tableById(id){ return TABLES.find(t => t.id === id); }

function centerOn(el) {
  const box = document.querySelector('.plan-scroll');
  if (!box || box.scrollWidth <= box.clientWidth) return;
  const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
  box.scrollLeft += (r.left + r.width / 2) - (b.left + b.width / 2);
}

function highlight(id) {
  document.querySelectorAll('#map .tbl').forEach(el => el.classList.toggle('on', el.dataset.table === id));
  const hit = document.querySelector('#map .tbl.on');
  if (hit) centerOn(hit);
}

function guestList(names) {
  return '<ul class="g-list m-list">' + names.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>';
}

function showTable(id) {
  const t = tableById(id);
  if (!t) return;
  highlight(id);
  const cap = capOf(t.id);
  const over = t.guests.length - cap;
  openModal(
    '<div class="m-head"><span class="m-title" id="m-title">' + esc(t.id) + '</span>' +
    '<span class="m-note">' + (t.note ? esc(t.note) + ' \u00b7 ' : '') + t.guests.length + ' seated</span></div>' +
    (over > 0 ? '<p class="m-warn">' + over + ' over the ' + cap + ' seats at this table</p>' : '') +
    guestList(t.guests));
}

// A search hit: the guest and their table first, then who they're sitting with.
function openMatch(h) {
  highlight(h.table.id);
  const others = h.table.guests.filter(g => g !== h.guest);
  openModal(
    '<div class="m-match"><div class="m-name" id="m-title">' + esc(h.guest) + '</div>' +
    '<div class="m-where"><span class="m-tbl">' + esc(h.table.id) + '</span>' +
    (h.table.note ? '<span class="m-note">' + esc(h.table.note) + '</span>' : '') + '</div></div>' +
    (others.length ? '<p class="m-label">Seated with</p>' + guestList(others)
                   : '<p class="m-label">No one else is seated here yet</p>'));
}

function openMatches(hits) {
  openModal(
    '<div class="m-head"><span class="m-title" id="m-title">' + hits.length + ' matches</span>' +
    '<span class="m-note">Tap your name</span></div>' +
    hits.map((h, i) => '<button type="button" class="hit" data-i="' + i + '">' +
      '<span class="hit-name">' + esc(h.guest) + '</span>' +
      '<span class="hit-table">' + esc(h.table.id) + '</span></button>').join(''));
  document.querySelectorAll('#m-body .hit').forEach(b =>
    b.addEventListener('click', () => openMatch(hits[+b.dataset.i])));
}

const modal = document.getElementById('modal');
let lastFocus = null;

function openModal(html) {
  document.getElementById('m-body').innerHTML = html;
  if (modal.hidden) lastFocus = document.activeElement;   // keep the original trigger when switching views
  modal.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('m-close').focus();
}

function closeModal() {
  if (modal.hidden) return;
  modal.hidden = true;
  document.body.style.overflow = '';
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

document.getElementById('m-close').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

document.querySelectorAll('#map .tbl').forEach(el => {
  el.addEventListener('click', () => showTable(el.dataset.table));
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showTable(el.dataset.table); }
  });
});

const chart = document.getElementById('chart');
function paintMap() {
  document.querySelectorAll('#map .tbl').forEach(el => {
    const t = tableById(el.dataset.table);
    const n = t ? t.guests.length : 0;
    el.classList.toggle('empty', n === 0);
    el.classList.toggle('over', n > capOf(el.dataset.table));
  });
}

function renderNotices() {
  const box = document.getElementById('notices');
  const msgs = [];
  TABLES.forEach(t => {
    const c = capOf(t.id);
    if (t.guests.length > c) msgs.push('<strong>' + esc(t.id) + '</strong> has ' + t.guests.length +
      ' seated but only ' + c + ' seats — ' + (t.guests.length - c) + ' over.');
  });
  if (UNASSIGNED.length) msgs.push('<strong>' + UNASSIGNED.length + '</strong> guest' +
    (UNASSIGNED.length > 1 ? 's have' : ' has') + ' no table yet: ' + UNASSIGNED.map(esc).join(', ') + '.');
  box.innerHTML = msgs.length ? msgs.map(m => '<p class="notice">' + m + '</p>').join('') : '';
}

function boot(guests) {
  TABLES = buildTables(guests);
  chart.innerHTML = TABLES.map(t =>
    '<div class="t-card"><div class="t-head"><span class="t-id">' + esc(t.id) + '</span>' +
    '<span class="t-note">' + esc(t.note || (t.guests.length + ' seated')) + '</span></div>' +
    '<ul class="g-list">' + t.guests.map(g => '<li>' + esc(g) + '</li>').join('') + '</ul></div>').join('');
  paintMap();
  renderNotices();
  document.getElementById('loading').hidden = true;
}

function failed(msg) {
  document.getElementById('loading').textContent = msg ||
    'We could not load the seating chart just now. Please refresh, or ask our coordinator at 0965 207 6143.';
}

const planBox = document.querySelector('.plan-scroll');
if (planBox) planBox.scrollLeft = (planBox.scrollWidth - planBox.clientWidth) / 2;

if (!SEATS_URL) {
  failed('The seating chart is not connected yet.');
} else {
  fetch(SEATS_URL + '?view=seats')
    .then(r => r.json())
    .then(d => {
      if (!d || d.ok === false) throw new Error((d && d.error) || 'seats unavailable');
      boot(d.guests || []);
    })
    .catch(() => failed());
}

document.getElementById('toggle').addEventListener('click', () => {
  chart.hidden = !chart.hidden;
  document.getElementById('toggle').textContent =
    chart.hidden ? 'View the full seating chart' : 'Hide the seating chart';
});
</script>
