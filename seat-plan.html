    .chart[hidden] { display: none; }
    .t-card { background: rgba(255,255,255,.75); border: 1px solid rgba(168,155,187,.35); border-radius: 12px; padding: 1.1rem 1.25rem; }

const tokens = s => (s || '')
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase().replace(/[.,]/g, ' ')
  .replace(/\b(mr|mrs|ms|miss|sir|madam|dr|doctor|engr|atty|rev|fr|hon|prof|sr|jr|iii|iv|ii)\b/g, ' ')
  .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').filter(Boolean);

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function find(q) {
  const t = tokens(q);
  if (!t.length) return [];
  const hits = [];
  TABLES.forEach(tb => tb.guests.forEach(g => {
    const gt = tokens(g);
    if (t.every(x => gt.includes(x))) hits.push({ guest: g, table: tb });
  }));
  return hits;
}

function search() {
  const q = document.getElementById('q').value.trim();
  const res = document.getElementById('result');
  const msg = document.getElementById('msg');
  res.innerHTML = ''; msg.textContent = '';
  if (!q) { msg.textContent = 'Please enter your name.'; return; }
  const hits = find(q);
  if (!hits.length) {
    msg.textContent = 'We couldn\u2019t find that name. Please check the spelling, or ask our coordinator at 0965 207 6143.';
    return;
  }
  res.innerHTML = hits.map(h => {
    const others = h.table.guests.filter(g => g !== h.guest);
    return '<div class="result-card">' +
      '<div class="r-name">' + esc(h.guest) + '</div>' +
      '<div class="r-table">' + esc(h.table.id) + '</div>' +
      '<div class="r-note">' + esc(h.table.note) + '</div>' +
      (others.length ? '<div class="r-with"><span>Seated with</span>' + others.map(esc).join(' &middot; ') + '</div>' : '') +
    '</div>';
  }).join('');
}

document.getElementById('go').addEventListener('click', search);
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); search(); }
});

const chart = document.getElementById('chart');
chart.innerHTML = TABLES.map(t =>

document.getElementById('toggle').addEventListener('click', () => {
  chart.hidden = !chart.hidden;
  document.getElementById('toggle').textContent =
    chart.hidden ? 'View the full seating chart' : 'Hide the seating chart';
